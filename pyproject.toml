[project]
name = "agent-framework-testing"
version = "0.1.0"
description = "Microsoft Agent Framework demo: Azure OpenAI, MCP, workflows, and user-scoped tool calls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.11.0",
    "agent-framework-devui>=1.0.0b260721",
    "azure-identity>=1.25.0",
    "fastapi>=0.138.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.52.0",
    "pre-commit>=4.3.0",
    "fastmcp>=3.4.7",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
